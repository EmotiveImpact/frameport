[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "frameport"
version = "0.1.0"
description = "Evidence-led website to editable React and HTML conversion studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.48.0", "playwright==1.57.0",
  "pydantic==2.13.4", "Pillow==12.3.0", "tinycss2==1.5.1", "httpx==0.28.1"
]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1", "beautifulsoup4>=4.13,<5"]
[project.scripts]
frameport = "frameport.cli:main"

[tool.vercel]
entrypoint = "vercel_app:app"

[tool.setuptools.packages.find]
include = ["frameport*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
