name: Frameport checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[dev]'
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run typecheck
      - run: pytest -q
      - run: python -m playwright install --with-deps chromium
      - name: Monochrome studio and original WebGL shader
        env:
          FRAMEPORT_UNSANDBOXED_TEST_BROWSER: '1'
        run: python -m scripts.check_design --software-gl --output artifacts/design
      - name: Authored fixture through real browser navigation
        # Only our trusted local fixture; not a production sandbox assurance.
        env:
          FRAMEPORT_UNSANDBOXED_TEST_BROWSER: '1'
        run: python -m scripts.check_fixture --data .frameport-ci --output fixture-result.json
      - name: Audit and compile generated React with installed dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/acceptance
          AUDIT="$PWD/artifacts/acceptance/npm-audit.json"
          JOB=$(python -c "import json; print(json.load(open('fixture-result.json'))['id'])")
          cd ".frameport-ci/jobs/$JOB/react"
          npm install --ignore-scripts
          npm audit --audit-level=high --json | tee "$AUDIT"
          npm run build
      - name: React visual checks and authenticated studio acceptance
        env:
          FRAMEPORT_UNSANDBOXED_TEST_BROWSER: '1'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/acceptance
          python -u -m scripts.check_acceptance --job fixture-result.json --data .frameport-ci --output artifacts/acceptance 2>&1 | tee artifacts/acceptance/console.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-evidence
          path: |
            artifacts/design/*.json
            artifacts/design/*.png
            fixture-result.json
            .frameport-ci/jobs/*/report.json
            .frameport-ci/jobs/*/model.json
            .frameport-ci/jobs/*/evidence
            .frameport-ci/jobs/*/html.zip
            .frameport-ci/jobs/*/react.zip
            artifacts/acceptance/*.json
            artifacts/acceptance/*.png
            artifacts/acceptance/console.txt
            artifacts/acceptance/edited-*.zip
            package-lock.json
            .frameport-ci/jobs/*/react/package-lock.json
